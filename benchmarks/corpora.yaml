# Per-language benchmark corpora. One source for every tier of the language benchmark
# (benchmarks/run_languages.py). Clone them with:
#   python -m benchmarks.corpora setup [--languages C#,PHP]
#
# Each entry is one pinned checkout under benchmarks/repos/<name>.
#   tiers: which tiers use it. quick = `nexus-mcp-ci eval`, retrieval = evals/retrieval hit@1,
#          graph = evals/graph_coverage.py, live = benchmarks/runner.py (paid).
#   sparse: folders to check out (cone mode). Empty: the whole repo.
#   tasks / task_ids: the live task suite and the 6 tasks of the language set
#          (2 conceptual, 2 impact, 1 architecture, 1 needle), so each language has the same mix.
#   suite: the retrieval suite name in evals/retrieval/queries*.yaml.
# Pins were taken on 2026-11-05 unless an existing suite fixed them earlier.

corpora:
  - name: flask
    language: Python
    repo: pallets/flask
    url: https://github.com/pallets/flask.git
    pin: d73fa1cdcbd8b1465c151db8924ba58b1dd14e35
    sparse: []
    tiers: [quick, retrieval, graph]
    suite: flask

  - name: django
    language: Python
    repo: django/django
    url: https://github.com/django/django.git
    pin: 318a316a4c86a65bede68144f9546a6056d91379
    sparse: []
    tiers: [live]
    tasks: benchmarks/tasks/django.yaml
    task_ids:
      - dj-concept-signal-dispatch
      - dj-concept-field-validation
      - dj-impact-sqlcompiler-as-sql
      - dj-impact-field-validate
      - dj-arch-request-to-query
      - dj-needle-charfield-class

