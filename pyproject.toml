[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-mcp-ci"
version = "2.4.0"
description = "Local code-intelligence MCP server for Claude Code, Codex and Cursor: hybrid code search, call graph and project memory in fewer tokens. Measure it on your repo with `nexus-mcp-ci eval`."
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.13"
authors = [
    { name = "Shreyas Jagannath" },
]
keywords = [
    "mcp", "mcp-server", "model-context-protocol",
    "code-search", "semantic-search", "hybrid-search",
    "code-graph", "code-analysis", "code-intelligence",
    "vector-search", "bm25", "ai-coding",
    "tree-sitter", "lancedb", "local-first",
    "claude-code", "codex", "cursor", "ai-agent", "llm",
    "token-efficiency", "code-navigation", "rag",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastmcp>=3.1,<5",
    "lancedb>=0.4.0",
    "sentence-transformers>=3.0.0",
    "optimum>=1.19.0",
    "onnxruntime>=1.17.0,<1.24.0",  # 1.24.0+ dropped Python 3.10 wheels
    "tree-sitter==0.21.3",
    "tree-sitter-languages>=1.10.0",
    "ast-grep-py>=0.28.0",
    "rustworkx>=0.15.0",
    "pathspec>=0.11.0",
    "watchdog>=3.0.0",
    "pyarrow>=14.0.0",
]

[project.urls]
Homepage = "https://jaggernaut007.github.io/nexus-mcp/"
Repository = "https://github.com/jaggernaut007/Nexus-MCP"
Documentation = "https://github.com/jaggernaut007/Nexus-MCP/blob/main/docs/USAGE_GUIDE.md"
Issues = "https://github.com/jaggernaut007/Nexus-MCP/issues"
Changelog = "https://github.com/jaggernaut007/Nexus-MCP/blob/main/CHANGELOG.md"
Evaluate = "https://github.com/jaggernaut007/Nexus-MCP/blob/main/docs/EVALUATE.md"
Benchmarks = "https://jaggernaut007.github.io/nexus-mcp/benchmarks.html"
Privacy = "https://github.com/jaggernaut007/Nexus-MCP/blob/main/docs/PRIVACY.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "hypothesis>=6.0.0",
    "ruff>=0.4.0",
    "mypy>=1.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]
gpu = [
    "sentence-transformers[onnx-gpu]>=3.0.0",
    "optimum[onnxruntime-gpu]>=1.19.0",
]
onnx = [
    # optimum 2.x moved the ONNX Runtime code into optimum-onnx. Needed to load a model
    # with the ONNX backend (jina-code, or the candidates in evals/retrieval).
    "optimum-onnx[onnxruntime]>=0.1.0",
]
bench = [
    "pyyaml>=6.0",
]

[project.scripts]
nexus-mcp = "nexus_mcp.server:main"
nexus-mcp-ci = "nexus_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_mcp"]

[tool.hatch.build.targets.wheel.force-include]
# The routing skill, for the `nexus` condition of `nexus-mcp-ci eval --agent`. One copy in the repo.
"plugin/skills/nexus-mcp/SKILL.md" = "nexus_mcp/evaluate/data/SKILL.md"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["evals/fixtures", "benchmarks/repos"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# The benchmarks page is an HTML template; its lines follow the HTML, not the 100-column limit.
"scripts/publish_results.py" = ["E501"]
# One table row of prose per variable; wrapping the sentences would hide the table.
"scripts/gen_config_docs.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
