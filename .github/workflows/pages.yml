name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "llms.txt"
      - "llms-full.txt"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 5 * * *" # refresh PyPI download counts daily
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp llms.txt _site/llms.txt
          cp llms-full.txt _site/llms-full.txt
          touch _site/.nojekyll

      - name: Fetch PyPI download counts
        # pypistats.org has no CORS headers, so the browser cannot fetch it.
        # Failure is not fatal: the site hides the stat when the file is missing.
        run: |
          curl -fsS --retry 3 --max-time 30 \
            https://pypistats.org/api/packages/nexus-mcp-ci/recent \
            | jq '{last_day: .data.last_day, last_week: .data.last_week, last_month: .data.last_month, updated: (now | todate)}' \
            > _site/downloads.json || rm -f _site/downloads.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
