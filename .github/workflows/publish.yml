name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  id-token: write

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build
        run: pip install build
      - name: Build sdist and wheel
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  registry:
    name: Publish to the MCP Registry
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
    steps:
      - uses: actions/checkout@v4
      - name: Check that server.json matches the release version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          python3 - "$version" <<'PY'
          import json, sys
          data = json.load(open("server.json"))
          want = sys.argv[1]
          found = {data["version"], *(p["version"] for p in data["packages"])}
          if found != {want}:
              sys.exit(f"server.json versions {sorted(found)} do not match pyproject {want}")
          PY
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Publish server.json
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  mcpb:
    name: Build the Desktop Extension
    # The bundle installs nexus-mcp-ci==<version> from PyPI, so PyPI must have it first.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MCPB_CLI_VERSION: 2.1.2
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check that the bundle matches the release version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          python3 - "$version" <<'PY'
          import json, re, sys
          want = sys.argv[1]
          manifest = json.load(open("mcpb/manifest.json"))["version"]
          toml = open("mcpb/pyproject.toml").read()
          pinned = re.search(r"nexus-mcp-ci==([^\"']+)", toml).group(1)
          if {manifest, pinned} != {want}:
              sys.exit(f"mcpb versions {manifest}/{pinned} do not match pyproject {want}")
          PY
      - name: Pack the bundle
        run: npx --yes "@anthropic-ai/mcpb@${MCPB_CLI_VERSION}" pack mcpb nexus-mcp.mcpb
      - name: Attach the bundle to the release
        run: gh release upload "$RELEASE_TAG" nexus-mcp.mcpb --clobber

  image:
    name: Push the Docker image to GHCR
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/jaggernaut007/nexus-mcp
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          docker build -f docker/Dockerfile.stdio --build-arg "VERSION=${version}" \
            -t "${IMAGE}:${version}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${version}"
          docker push "${IMAGE}:latest"
